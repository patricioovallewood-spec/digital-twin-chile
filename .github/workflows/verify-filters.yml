name: Verify territorial filters
on:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/verify-filters.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filters-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browsers
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Syntax check
        run: |
          node --check app.js
          python -m py_compile tests/test_filters.py
      - name: Regression checks on checked-out code
        run: python tests/test_filters.py
      - name: Live OSM integration check
        if: success()
        run: python tests/test_filters.py --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filter-tests-${{ github.sha }}
          path: test-results/
